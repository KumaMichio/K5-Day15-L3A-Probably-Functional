const ROUTES = ["overview", "hung", "hue", "tan", "thanh", "git"];
const LABELS = { overview: "Tổng quan", hung: "Hùng", hue: "Huệ", tan: "Tân", thanh: "Thành", git: "Luật git" };

let doneSet = new Set();
try { doneSet = new Set(JSON.parse(localStorage.getItem("pf-done") || "[]")); } catch (e) {}
function saveDone() { try { localStorage.setItem("pf-done", JSON.stringify([...doneSet])); } catch (e) {} }

function chip(key, kind) {
  const m = MEMBERS[key];
  return `<span class="chip ${kind || ""}" style="color:${m.color}"><span class="dot" style="background:${m.color}"></span>${m.short}</span>`;
}
function ownersOf(t) {
  if (t.owner === "all") return ["hung", "hue", "tan", "thanh"];
  return [t.owner, ...((t.with || []).filter(x => x !== "all"))];
}
function involves(t, key) {
  return t.owner === "all" || t.owner === key || (t.with || []).includes(key) || (t.with || []).includes("all");
}
function chipsFor(t) {
  let h = chip(t.owner, "lead");
  if (t.owner === "all" && t.lead) {
    const m = MEMBERS[t.lead];
    h += `<span class="chip support" style="color:${m.color}"><span class="dot" style="background:${m.color}"></span>dẫn: ${m.short}</span>`;
  }
  (t.with || []).forEach(w => { h += chip(w, "support"); });
  return `<div class="chips">${h}</div>`;
}

function renderStrip() {
  const now = Date.now();
  let nextFound = false;
  document.getElementById("strip").innerHTML = PHASES.map(p => {
    const t = Date.parse(p.at);
    let cls = "ms", tag = "";
    if (t < now) cls += " past";
    else if (!nextFound) { cls += " next"; nextFound = true; tag = `<span class="tag">Mốc tiếp theo</span>`; }
    return `<div class="${cls}"><b>${p.name}</b><span>${p.when}</span><br>${tag}</div>`;
  }).join("");
}

function renderNav(route) {
  document.getElementById("nav").innerHTML = ROUTES.map(r => {
    const dot = MEMBERS[r] ? `<span class="dot" style="background:${MEMBERS[r].color}"></span>` : "";
    const href = r === "overview" ? "#" : "#" + r;
    return `<a href="${href}" ${r === route ? 'aria-current="page"' : ""}>${dot}${LABELS[r]}</a>`;
  }).join("");
}

  const groups = PHASES.map(p => {
    const rows = TASKS.filter(t => t.p === p.id).map(t => `
      <tr class="${doneSet.has(t.id) ? "isdone" : ""}"><td class="id">${t.id}</td><td class="t">${t.title}</td><td>${chipsFor(t)}</td><td class="due">${t.due}</td><td><code>${t.out}</code></td></tr>`).join("");
    return `<section><div class="sechead"><h2>${p.name}</h2><span class="when">${p.when} · ${p.note}</span></div>
      <div class="tablewrap"><table><thead><tr><th>Mã</th><th>Việc</th><th>Ai</th><th>Hạn</th><th>Ra file</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
  }).join("");
  return `<section>${intro}${legend}</section>` + groups;
}

function card(t, key) {
  const isLead = t.owner === key || (t.owner === "all");
  const roleNote = t.owner === "all" ? (t.lead === key ? "Cả nhóm · bạn dẫn" : "Cả nhóm cùng làm")
                  : (isLead ? "Bạn chịu trách nhiệm chính" : "Bạn hỗ trợ " + MEMBERS[t.owner].short);
  return `<div class="card ${doneSet.has(t.id) ? "isdone" : ""}">
    <div class="check"><input type="checkbox" id="chk-${key}-${t.id}" data-id="${t.id}" ${doneSet.has(t.id) ? "checked" : ""} aria-label="Đánh dấu ${t.id} đã xong"></div>
    <div class="top"><span class="tid">${t.id}</span><h3>${t.title}</h3><span class="due">${t.due}</span></div>
    <div class="body">${t.body}</div>
    <div class="meta"><span><b>${roleNote}</b></span><span>Ra file: <code>${t.out}</code></span><span>Xong khi: ${t.done}</span><span>Guide: ${t.step}</span></div>
  </div>`;
}

function renderMember(key) {
  const m = MEMBERS[key];
  const mine = TASKS.filter(t => involves(t, key));
  const nLead = mine.filter(t => t.owner === key).length;
  const head = `<div class="role" style="border-left-color:${m.color}">
      <span class="eyebrow">${m.role}</span><h2>${m.name}</h2><p>${m.focus}</p>
      <p class="note">${nLead} việc chính · ${mine.length - nLead} việc cùng làm / hỗ trợ · nhánh git của bạn: <code>${key}/T..-ten-viec</code></p></div>`;
  const groups = PHASES.map(p => {
    const ts = mine.filter(t => t.p === p.id);
    if (!ts.length) return "";
    return `<section><div class="sechead"><h2>${p.name}</h2><span class="when">${p.when}</span></div>
      <div class="cards">${ts.map(t => card(t, key)).join("")}</div></section>`;
  }).join("");
  return `<section>${head}</section>` + groups;
}

function render() {
  let route = (location.hash || "").replace("#", "");
  if (!ROUTES.includes(route)) route = "overview";
  renderStrip(); renderNav(route);
  const main = document.getElementById("main");
  main.innerHTML = route === "overview" ? renderOverview() : route === "git" ? RULES_HTML : renderMember(route);
  main.querySelectorAll('input[type="checkbox"][data-id]').forEach(cb => cb.addEventListener("change", e => {
    const id = e.target.dataset.id;
    if (e.target.checked) doneSet.add(id); else doneSet.delete(id);
    saveDone(); e.target.closest(".card").classList.toggle("isdone", e.target.checked);
  }));
}
window.addEventListener("hashchange", render);
render();
</script>

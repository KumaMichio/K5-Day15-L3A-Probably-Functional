function chip(key, kind, label) {
  const m = MEMBERS[key];
  return `<span class="chip ${kind || ""}" style="color:${m.color}"><span class="dot" style="background:${m.color}"></span>${label || m.short}</span>`;
}
function chipsFor(t) {
  let h = chip(t.owner);
  if (t.owner === "all" && t.lead) h += chip(t.lead, "support", "dẫn: " + MEMBERS[t.lead].short);
  (t.with || []).forEach(w => { h += chip(w, "support"); });
  return `<div class="chips">${h}</div>`;
}
function issue(n, bare) {
  const t = BY_N[n];
  const who = t ? (t.owner === "all" ? "Cả nhóm" : MEMBERS[t.owner].short) : "";
  const tip = t ? `${t.title} · ${who}` : "";
  return `<a class="issue ${doneSet.has(n) ? "isdone" : ""}" href="${REPO}${n}" target="_blank" rel="noopener" title="${tip}">#${n}${who && !bare ? " · " + who : ""}</a>`;
}
function depsLine(t) {
  const parts = [];
  if ((t.dep || []).length) parts.push(`<span class="blocking">Chờ:</span>${t.dep.map(n => issue(n)).join("")}`);
  else parts.push(`<span class="free">Làm ngay</span>`);
  if ((t.soft || []).length) parts.push(`<span>cập nhật khi có:</span>${t.soft.map(n => issue(n)).join("")}`);
  if ((BLOCKS[t.n] || []).length) parts.push(`<span>Đang được chờ bởi:</span>${BLOCKS[t.n].map(n => issue(n)).join("")}`);
  return `<div class="deps">${parts.join('<span aria-hidden="true">·</span>')}</div>`;
}
function involves(t, key) {
  return t.owner === "all" || t.owner === key || (t.with || []).includes(key) || (t.with || []).includes("all");
}

function renderStrip() {
  const now = Date.now(); let found = false;
  document.getElementById("strip").innerHTML = PHASES.map(p => {
    const t = Date.parse(p.at); let cls = "ms", tag = "";
    if (t < now) cls += " past";
    else if (!found) { cls += " next"; found = true; tag = `<span class="tag">Hạn tiếp theo</span>`; }
    return `<div class="${cls}"><b>${p.name}</b><span>${p.when}</span><span class="off">${p.off}</span>${tag}</div>`;
  }).join("");
}

function card(t, key) {
  const note = t.owner === "all" ? (t.lead === key ? "Cả nhóm · bạn dẫn" : "Cả nhóm cùng làm")
             : (t.owner === key ? "Bạn chịu trách nhiệm chính" : "Bạn hỗ trợ " + MEMBERS[t.owner].short);
  return `<div class="card ${doneSet.has(t.n) ? "isdone" : ""}">
    <div class="check"><input type="checkbox" id="chk-${key}-${t.n}" data-n="${t.n}" ${doneSet.has(t.n) ? "checked" : ""} aria-label="Đánh dấu #${t.n} đã xong"></div>
    <div class="top">${issue(t.n, 1)}<h3>${t.title}</h3><span class="due">${t.due}</span></div>
    <div class="body"><ul>${t.body.map(b => `<li>${b}</li>`).join("")}</ul></div>
    ${depsLine(t)}
    <div class="meta"><span><b>${note}</b></span><span>Ra file: <code>${t.out}</code></span><span>Xong khi: ${t.done}</span></div>
  </div>`;
}

function renderMember(key) {
  const m = MEMBERS[key];
  const mine = TASKS.filter(t => involves(t, key));
  const nLead = mine.filter(t => t.owner === key).length;
  const head = `<div class="role" style="border-left-color:${m.color}"><span class="eyebrow">${m.role}</span><h2>${m.name}</h2><p>${m.focus}</p>
    <p class="note">${nLead} việc chính · ${mine.length - nLead} việc cùng làm · nhánh git: <code>${key}/&lt;số-issue&gt;-ten-viec</code></p></div>`;
  const groups = PHASES.map(p => {
    const ts = mine.filter(t => t.p === p.id);
    if (!ts.length) return "";
    return `<section><div class="sechead"><h2>${p.name}</h2><span class="when">hạn ${p.when} · ${p.off}</span></div><div class="cards">${ts.map(t => card(t, key)).join("")}</div></section>`;
  }).join("");
  return `<section>${head}</section>` + groups;
}

  const main = document.getElementById("main");
  main.innerHTML = route === "overview" ? renderOverview() : route === "git" ? RULES_HTML : renderMember(route);

}

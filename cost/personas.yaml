# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
# Mọi số dưới đây đã thay bằng số và nguồn của nhóm (Tân, 27/11).

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số học viên hỏi trợ giảng dưới video trong 1 tháng — 3 kịch bản
  low: 143
  base: 218
  high: 436
  source: "data/preclass 05–25/11: thấp = 143 học viên đã hỏi trợ giảng dưới video (count_preclass.py [I]); cơ sở = 50% của 436 học viên có hoạt động (tự ước tính: trợ giảng trả lời có căn cứ thì thêm người dùng); cao = cả 436 học viên có hoạt động (README data/preclass)"

personas:           # 4 nhóm theo số câu hỏi trợ giảng / học viên — evidence/scripts/count_preclass.py [I], [J]
                    # phiên = chuỗi câu của cùng học viên cách nhau ≤ 30 phút; quy tháng × 30/21
  - name: hoi_it
    share: 0.266            # 38/143 học viên hỏi đúng 1 câu trong 21 ngày
    uses_per_month: 1.4
    turns_per_session: 1    # 1,0 câu / phiên
    source: "data/preclass, count_preclass.py [J] nhóm 1 câu"
  - name: hoi_vua
    share: 0.322            # 46/143 học viên hỏi 2–5 câu
    uses_per_month: 2.4
    turns_per_session: 2    # 2,0 câu / phiên
    source: "data/preclass, count_preclass.py [J] nhóm 2–5 câu"
  - name: hoi_nhieu
    share: 0.301            # 43/143 học viên hỏi 6–15 câu
    uses_per_month: 3.3
    turns_per_session: 4    # 4,0 câu / phiên
    source: "data/preclass, count_preclass.py [J] nhóm 6–15 câu"
  - name: hoi_don
    share: 0.111            # 16/143 học viên hỏi ≥16 câu (ôn dồn); data 11,2%, làm tròn xuống để 4 share cộng đúng 1
    uses_per_month: 8.8
    turns_per_session: 5    # 5,1 câu / phiên, làm tròn
    source: "data/preclass, count_preclass.py [J] nhóm ≥16 câu"
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).

prices:             # USD / 1 triệu token — further-reading/model-prices.md của repo đề (BTC tra ngày 25/11/2026)
  - model: claude-haiku-5-5
    input: 0.10
    output: 0.50
    source: "Claude Haiku 5.5 (tầng Nhỏ, prompt ≤ 100K token) · https://platform.claude.com/docs/en/about-claude/pricing · xem 25/11/2026 (model-prices.md)"
  - model: claude-sonnet-5-5
    input: 2.00
    output: 10.00
    source: "Claude Sonnet 5.5 (tầng Lớn) · https://platform.claude.com/docs/en/about-claude/pricing · xem 25/11/2026 (model-prices.md)"
  - model: gemini-3.1-flash-lite
    input: 0.25
    output: 1.50
    source: "gemini-3.1-flash-lite (tầng Nhỏ, có free tier để build) · https://ai.google.dev/gemini-api/docs/pricing · xem 25/11/2026 (model-prices.md)"

usd_to_vnd:         # tuỳ chọn: chưa có nguồn tỷ giá nên để trống
  rate:
  source:
